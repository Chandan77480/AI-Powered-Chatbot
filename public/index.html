<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot API</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f8f3e8; background: #182326; background-image: radial-gradient(circle at 15% 10%, #31504d 0, transparent 30%), linear-gradient(135deg, #182326, #33261f); }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 32px; }
    header { margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: #e5ad63; font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 68px); line-height: .95; font-weight: 500; }
    .intro { max-width: 520px; color: #c8ccc2; font: 16px/1.5 system-ui, sans-serif; }
    #messages { min-height: 320px; padding: 20px; border: 1px solid #53605b; background: rgba(12, 19, 20, .55); }
    .message { max-width: 82%; margin: 0 0 16px; padding: 12px 16px; border-left: 3px solid #e5ad63; white-space: pre-wrap; font: 16px/1.45 system-ui, sans-serif; }
    .message.user { margin-left: auto; border-left: 0; border-right: 3px solid #86c7bc; text-align: right; }
    form { display: flex; gap: 10px; margin-top: 14px; }
    textarea { flex: 1; min-height: 54px; resize: vertical; padding: 14px; border: 1px solid #53605b; color: #f8f3e8; background: #11191a; font: 16px system-ui, sans-serif; }
    button { min-width: 110px; border: 0; color: #182326; background: #e5ad63; font: 700 15px system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 560px) { main { padding-top: 32px; } form { flex-direction: column; } button { min-height: 48px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local chatbot</p>
      <h1>Ask something.</h1>
      <p class="intro">Your message is sent to the configured chatbot service through this local API.</p>
    </header>
    <section id="messages" aria-live="polite">
      <div class="message">Hello. What would you like to know?</div>
    </section>
    <form id="chat-form">
      <textarea id="message" placeholder="Write a message..." required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const messages = document.getElementById('messages');
    const button = form.querySelector('button');

    function addMessage(text, type) {
      const item = document.createElement('div');
      item.className = `message ${type}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        addMessage(response.ok ? data.response : `Error: ${data.error || 'Request failed'}`, 'assistant');
      } catch (error) {
        addMessage('Could not connect to the local API.', 'assistant');
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
